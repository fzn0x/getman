name: Docs

# Builds the documentation site from docs/ and site/ and publishes it to
# GitHub Pages from main. Pull requests that touch the documentation build
# it too, so a broken link to a page or a bad heading fails before merge.
# The landing page links the files of the latest release, so the site is
# rebuilt when the Release workflow finishes. A release made with
# GITHUB_TOKEN does not start other workflows by its release events, but
# a finished workflow run does.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - site/**
      - web/public/fonts/**
      - web/public/favicon.svg
      - web/src/styles/tokens.css
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - site/**
      - web/src/styles/tokens.css
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install npm dependencies
        working-directory: site
        run: npm ci
      - name: Check formatting
        working-directory: site
        run: npm run check
      - name: Check the install scripts
        run: sh -n site/static/install.sh
      - name: Build
        working-directory: site
        run: npm run build
        env:
          # Reads the latest release's file names, with a higher rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
