name: Release

# Pushing a v* tag builds the browser UI once, builds getman with it for
# every platform, and publishes the archives with checksums.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Build the web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
      - working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist

  build:
    name: Build for ${{ matrix.target }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, like the ARM runner, so the binary links against the same
          # glibc on every release instead of whatever ubuntu-latest becomes.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --package getman --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="getman-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/getman.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/getman" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
