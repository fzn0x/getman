name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-web
      - name: Type-check and check formatting
        working-directory: web
        run: npm run check
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  lint:
    name: Format and lint
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- --deny warnings

  test:
    name: Test on ${{ matrix.os }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Run the example workspace offline
        shell: bash
        run: |
          cargo run --quiet --locked -- init "$RUNNER_TEMP/smoke" --name Smoke
          cargo run --quiet --locked -- import -w "$RUNNER_TEMP/smoke" --curl "curl http://127.0.0.1:9/never"
          cargo run --quiet --locked -- export -w "$RUNNER_TEMP/smoke" get-never.yaml --to python

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The version is an input rather than the action's ref, which
      # dependabot would mistake for an action version to bump.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --workspace --all-targets --locked
