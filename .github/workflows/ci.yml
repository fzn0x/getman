name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No RUSTFLAGS here: it would replace the `--cfg reqwest_unstable` that
# .cargo/config.toml sets, and builds would lose HTTP/3 (a test checks).
env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Type-check and check formatting
        working-directory: web
        run: npm run check
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  lint:
    name: Format and lint
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The desktop app compiles against WebKitGTK on Linux.
      - uses: ./.github/actions/setup-desktop-linux
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- --deny warnings

  test:
    name: Test on ${{ matrix.os }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The desktop app compiles against WebKitGTK on Linux.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-desktop-linux
      - run: cargo test --workspace --locked
      - name: Run the example workspace offline
        shell: bash
        run: |
          cargo run --quiet --locked -- init "$RUNNER_TEMP/smoke" --name Smoke
          cargo run --quiet --locked -- import -w "$RUNNER_TEMP/smoke" --curl "curl http://127.0.0.1:9/never"
          cargo run --quiet --locked -- export -w "$RUNNER_TEMP/smoke" get-never.yaml --to python
      # On macOS and Linux the desktop app's executable is the getman
      # command too. (On Windows it is only ever the window.)
      - if: runner.os != 'Windows'
        name: Run the command line from the desktop app
        run: cargo run --quiet --locked --package getman-desktop -- --version

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version is an input rather than the action's ref, which
      # dependabot would mistake for an action version to bump.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      # The desktop app is left out on purpose: it sets its own
      # rust-version, the one Tauri needs (see its Cargo.toml), and is
      # built with stable by the other jobs.
      - run: cargo +1.88 check --workspace --exclude getman-desktop --all-targets --locked

  # Every code-export language, run for real: the tricky requests in
  # .github/scripts/verify-snippets.mjs are exported with getman and each
  # snippet is run against a local echo server, which checks that what
  # arrives is what the request says.
  getman:
    name: Build getman for the snippet checks
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --package getman
      - uses: actions/upload-artifact@v7
        with:
          name: getman-debug
          path: target/debug/getman
          retention-days: 1

  # `getman mcp`, driven by the official MCP Inspector command line.
  mcp:
    name: MCP server with the Inspector
    needs: getman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: getman-debug
          path: ${{ runner.temp }}/getman-bin
      - run: chmod +x "$RUNNER_TEMP/getman-bin/getman"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/verify-mcp.mjs --getman "$RUNNER_TEMP/getman-bin/getman"

  snippets:
    name: Snippets in ${{ matrix.name }}
    needs: getman
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: curl, langs: "getman,curl,http" }
          - { name: Wget, langs: wget }
          - { name: HTTPie, langs: httpie }
          - { name: PowerShell, langs: powershell }
          - { name: JavaScript, langs: "fetch,node,axios" }
          - { name: Python, langs: python }
          - { name: Go, langs: go }
          - { name: Rust, langs: rust }
          - { name: Java, langs: java }
          - { name: Kotlin, langs: kotlin }
          - { name: "C#", langs: csharp }
          - { name: Swift, langs: swift }
          - { name: PHP, langs: php }
          - { name: Ruby, langs: ruby }
          - { name: Dart, langs: dart }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: getman-debug
          path: ${{ runner.temp }}/getman-bin
      - run: chmod +x "$RUNNER_TEMP/getman-bin/getman"

      # curl, Wget and PowerShell (pwsh) come with the runner image.
      - if: matrix.name == 'HTTPie' || matrix.name == 'Python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - if: matrix.name == 'HTTPie'
        run: pip install httpie
      - if: matrix.name == 'Python'
        run: pip install requests
      - if: matrix.name == 'JavaScript'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: matrix.name == 'Go'
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - if: matrix.name == 'Rust'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.name == 'Java' || matrix.name == 'Kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # JetBrains publishes no setup action; the script installs their
      # compiler release and OkHttp, each checked against a pinned hash.
      - if: matrix.name == 'Kotlin'
        run: bash .github/scripts/setup-kotlin.sh
      - if: matrix.name == 'C#'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - if: matrix.name == 'Swift'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - if: matrix.name == 'PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl
      - if: matrix.name == 'Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - if: matrix.name == 'Dart'
        uses: dart-lang/setup-dart@v1

      - name: Run the snippets
        run: >-
          node .github/scripts/verify-snippets.mjs
          --getman "$RUNNER_TEMP/getman-bin/getman"
          --lang "${{ matrix.langs }}"
          --work "$RUNNER_TEMP/snippets"
      - name: Keep the snippets
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snippets-${{ matrix.name }}
          path: ${{ runner.temp }}/snippets/snippets
          retention-days: 7
