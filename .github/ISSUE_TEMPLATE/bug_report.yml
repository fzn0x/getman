name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. Please do not report security problems here;
        see [SECURITY.md](https://github.com/fzn0x/getman/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: The smallest request file that shows it
      description: Paste the YAML, with secrets removed. Say how you sent it (browser UI, terminal UI, `getman run`).
      render: yaml
  - type: input
    id: version
    attributes:
      label: Getman version
      description: The output of `getman --version`, or Settings > About in the desktop app.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
