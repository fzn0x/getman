# Flatpak manifest for the Getman desktop app. It repackages the release's
# .deb, so it needs no build of its own. Put the .deb of the architecture
# you build for in dist/ and write the metadata, then run flatpak-builder:
#
#   dist/getman-desktop_amd64.deb              the release's file, for x86_64
#   dist/getman-desktop_arm64.deb              the release's file, for aarch64
#   dist/io.github.fzn0x.getman.metainfo.xml   node packaging/render.mjs --only flatpak
#                                              --tag v0.3.4 --dist dist --out packaging/flatpak/dist
#
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.fzn0x.getman.yml
#
# The release workflow builds the bundles from this file, so the release
# files Getman-linux-x86_64.flatpak and Getman-linux-aarch64.flatpak hold
# exactly what this builds. See "Flatpak bundles" in CONTRIBUTING.md.
#
# - The desktop app checks for updates daily and cannot replace itself
#   inside a Flatpak; Flatpak updates it. Turn the check off in Settings.
# - The app opens workspaces anywhere in your files, so it asks for the home
#   folder. Narrow `--filesystem` if you only keep workspaces in one place.
id: io.github.fzn0x.getman
runtime: org.gnome.Platform
# The app needs WebKitGTK 4.1, which this runtime has. GNOME runtimes get
# about a year of support: move this version and the gnome-<version> image
# in release.yml and ci.yml together.
runtime-version: "51"
sdk: org.gnome.Sdk
command: getman
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
modules:
  - name: getman
    buildsystem: simple
    build-commands:
      - ar x getman-desktop.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/getman /app/bin/getman
      - |
        for icon in usr/share/icons/hicolor/*/apps/getman.png; do
          size="$(basename "$(dirname "$(dirname "$icon")")")"
          install -Dm644 "$icon" "/app/share/icons/hicolor/$size/apps/io.github.fzn0x.getman.png"
        done
      - install -Dm644 io.github.fzn0x.getman.desktop /app/share/applications/io.github.fzn0x.getman.desktop
      - install -Dm644 io.github.fzn0x.getman.metainfo.xml /app/share/metainfo/io.github.fzn0x.getman.metainfo.xml
    sources:
      - type: file
        path: dist/getman-desktop_amd64.deb
        dest-filename: getman-desktop.deb
        only-arches: [x86_64]
      - type: file
        path: dist/getman-desktop_arm64.deb
        dest-filename: getman-desktop.deb
        only-arches: [aarch64]
      - type: file
        path: dist/io.github.fzn0x.getman.metainfo.xml
      - type: inline
        dest-filename: io.github.fzn0x.getman.desktop
        contents: |
          [Desktop Entry]
          Type=Application
          Name=Getman
          Comment=Open-source Postman alternative
          Categories=Development;
          Icon=io.github.fzn0x.getman
          Exec=getman desktop
          StartupWMClass=getman
          Terminal=false
