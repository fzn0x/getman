[package]
name = "getman"
description = "A local-first API client: send requests, test APIs and run collections from plain files in your repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["api", "http", "rest", "client", "testing"]
categories = ["command-line-utilities", "development-tools::testing", "web-programming::http-client"]

[dependencies]
anstream = "1.0"
anstyle = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getman-core.workspace = true
getrandom = "0.4"
mime_guess = "2"
open = "5"
ratatui = "0.30"
rust-embed = "8"
rust_xlsxwriter = "0.101"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
# A WebSocket server for the terminal UI's tests to connect to.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
