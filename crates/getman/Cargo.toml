[package]
name = "getman"
description = "A local-first API client: send requests, test APIs and run collections from plain files in your repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["api", "http", "rest", "client", "testing"]
categories = ["command-line-utilities", "development-tools::testing", "web-programming::http-client"]

[dependencies]
anstream = "1.0"
anstyle = "1"
axum = "0.8"
base64 = "0.23"
# Decompresses the UI's files for a browser that does not take Brotli.
brotli = { version = "9", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getman-core.workspace = true
getrandom = "0.4"
hex = "0.4"
mime_guess = "2"
open = "5"
percent-encoding = "2"
ratatui = "0.30"
regex = "1"
rust-embed = "8"
rust_xlsxwriter = "0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

# A debug build reads the UI from web/dist at run time, which a phone does
# not have, so the mobile apps build it in even then.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rust-embed = { version = "8", features = ["debug-embed"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
# A WebSocket server for the terminal UI's tests to connect to.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
