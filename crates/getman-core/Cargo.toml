[package]
name = "getman-core"
description = "Workspace format, variables, HTTP execution, scripting and runner behind Getman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.23"
bytes = "1"
cookie_store = "0.22"
csv = "1"
fastrand = "2"
getrandom = "0.3"
hex = "0.4"
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.11"
mime_guess = "2"
percent-encoding = "2"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
protox = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "cookies", "gzip", "brotli", "deflate", "multipart", "system-proxy", "socks", "stream"] }
reqwest_cookie_store = "0.10"
rquickjs = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "sync", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
url = "2"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8"
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router", "codegen", "tls-ring"] }
tonic-prost = "0.14"
tonic-reflection = "0.14"
