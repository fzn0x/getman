[package]
name = "getman-core"
description = "Workspace format, variables, HTTP execution, scripting and runner behind Getman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.23"
cookie_store = "0.22"
csv = "1"
fastrand = "2"
getrandom = "0.3"
hex = "0.4"
hmac = "0.13"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.11"
mime_guess = "2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "cookies", "gzip", "brotli", "deflate", "multipart", "system-proxy", "socks", "stream"] }
reqwest_cookie_store = "0.10"
rquickjs = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "sync"] }
url = "2"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
