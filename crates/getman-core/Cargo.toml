[package]
name = "getman-core"
description = "Workspace format, variables, HTTP execution, scripting and runner behind Getman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.23"
brotli = { version = "9", default-features = false, features = ["std"] }
bytes = "1"
cookie_store = "0.22"
csv = "1"
fastrand = "2"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hex = "0.4"
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "client-proxy", "client-proxy-system"] }
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.11"
mime_guess = "2"
p12-keystore = "0.4"
p256 = "0.14"
p384 = "0.14"
percent-encoding = "2"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
protox = "0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "cookies", "gzip", "brotli", "deflate", "zstd", "multipart", "system-proxy", "socks", "stream"] }
reqwest_cookie_store = "0.10"
rquickjs = "0.14"
rsa = { version = "=0.10.0-rc.19", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tower-layer = "0.3"
tower-service = "0.3"
url = "2"
x509-parser = "0.18"
zstd = { version = "0.14", default-features = false }

[lints]
workspace = true

[dev-dependencies]
axum = { version = "0.8", features = ["http2"] }
bytes = "1"
http = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router", "codegen", "tls-ring"] }
tonic-prost = "0.14"
tonic-reflection = "0.14"
