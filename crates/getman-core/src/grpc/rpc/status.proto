// The rich error model gRPC servers send in grpc-status-details-bin.
// Getman decodes it to show the details of a failed call.
//
// The message definitions are those of google/rpc/status.proto in
// https://github.com/googleapis/googleapis, Copyright Google LLC, licensed
// under the Apache License, Version 2.0. The comments are Getman's own.
// See THIRD_PARTY_NOTICES.md at the top of the repository.

syntax = "proto3";

package google.rpc;

import "google/protobuf/any.proto";

message Status {
  int32 code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}
