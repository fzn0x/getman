// The rich error model gRPC servers send in grpc-status-details-bin.
// Getman decodes it to show the details of a failed call.

syntax = "proto3";

package google.rpc;

import "google/protobuf/any.proto";

message Status {
  int32 code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}
