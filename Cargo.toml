[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo build`, `run` and `test` leave out the desktop app, which
# needs a webview's system libraries on Linux; `--workspace` includes it.
default-members = ["crates/getman", "crates/getman-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fzn0x/getman"
homepage = "https://fzn0x.github.io/getman/"

[workspace.dependencies]
getman = { path = "crates/getman" }
getman-core = { path = "crates/getman-core" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
# Set in .cargo/config.toml; turns on reqwest's HTTP/3.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(reqwest_unstable)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
assert_is_empty = "allow"
assigning_clones = "allow"
doc_markdown = "allow"
format_collect = "allow"
format_push_string = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
too_many_lines = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
